services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - aikol_booking/.env.production
    restart: unless-stopped
    expose:
      - "8000"

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - web
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    restart: unless-stopped
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
