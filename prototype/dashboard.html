<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — AIKOL Booking System</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>

<div class="app">
    <div class="app-body">
        <main class="main" id="main" style="padding-top: 26px;">

            <!-- ===== Greeting and search, over the Kulliyyah photograph ===== -->
            <section class="search-hero" style="margin-bottom: 30px;" aria-labelledby="greeting">
                <img src="assets/images/AIKOL-building-scaled.jpg" alt="" id="heroImg">

                <div class="inner">
                    <div class="hero-line">
                        <div class="arabic">السلام عليكم</div>
                        <h1 id="greeting">Assalamualaikum</h1>
                        <div class="sub" id="subline"></div>
                    </div>

                    <form class="searchbar" id="searchbar">
                        <label>
                            <span class="k" for="fKind">Resource</span>
                            <select class="v" id="fKind">
                                <option value="Venue">Rooms</option>
                                <option value="Vehicle">Vehicles</option>
                            </select>
                        </label>
                        <label>
                            <span class="k">Date</span>
                            <input class="v" type="date" id="fDate">
                        </label>
                        <label>
                            <span class="k">From</span>
                            <select class="v" id="fFrom"></select>
                        </label>
                        <label>
                            <span class="k">To</span>
                            <select class="v" id="fTo"></select>
                        </label>
                        <label>
                            <span class="k">Building</span>
                            <select class="v" id="fBuilding"></select>
                        </label>
                        <button type="submit">Check availability</button>
                    </form>
                </div>

                <div class="caption" id="searchCaption">Pick a time and check — the answer appears below, and you can book straight from it.</div>
            </section>

            <!-- The answer to the search, in place. -->
            <div id="searchResult" style="margin-bottom: 30px;"></div>

            <!-- ===== Your activity ===== -->
            <div id="strip" style="margin-bottom: 30px; display: grid; grid-template-columns: 1fr 1fr; background: var(--brand); border-radius: var(--r); overflow: hidden;"></div>

            <!-- ===== Browse by type ===== -->
            <div style="display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px;">
                <h2 style="margin: 0;">Browse by room type</h2>
                <a href="venues.html" id="allLink">All rooms and cars →</a>
            </div>
            <div class="grid grid-4" id="cats"></div>

        </main>
    </div>
</div>

<script src="js/prototype.js"></script>
<script>
(function () {
    const A = AIKOL;
    A.buildChrome({ mode: 'user', active: 'dashboard.html' });

    const me = A.CURRENT_USER;
    const now = new Date();

    /* ---- Greeting ---- */
    const first = me.name.replace(/^(Dr\.|Prof\.|Assoc\. Prof\. Dr\.)\s+/, '').split(' ')[0];
    document.getElementById('greeting').textContent = 'Assalamualaikum, ' + first;
    document.getElementById('subline').textContent =
        A.DAYS[A.today.getDay()] + ', ' + A.fmtDate(A.today) +
        ' · Kulliyyah rooms and cars, bookable ' + A.SETTINGS.windowStart + '–' + A.SETTINGS.windowEnd +
        ', up to ' + A.SETTINGS.advanceBookingLimitDays + ' days ahead.';

    document.getElementById('allLink').textContent =
        'All ' + A.venues.length + ' rooms and ' + A.vehicles.length + ' cars →';

    /* ---- The search answers in place ------------------------------------
       The old bar navigated to the availability board and left the user to
       find the answer themselves. It now says yes or no, and books. */
    const S = A.SETTINGS;
    const todayISO = A.iso(A.today);
    const maxISO = A.iso(A.addDays(A.today, S.advanceBookingLimitDays));
    const $ = id => document.getElementById(id);

    function timeOpts(sel) {
        let h = '';
        for (let mm = A.toMin(S.windowStart); mm <= A.toMin(S.windowEnd); mm += 30) {
            const t = String(Math.floor(mm / 60)).padStart(2, '0') + ':' + String(mm % 60).padStart(2, '0');
            h += '<option value="' + t + '"' + (t === sel ? ' selected' : '') + '>' + A.fmtTime(t) + '</option>';
        }
        return h;
    }
    $('fFrom').innerHTML = timeOpts('10:00');
    $('fTo').innerHTML = timeOpts('12:00');
    $('fDate').min = todayISO;
    $('fDate').max = maxISO;
    $('fDate').value = todayISO;

    function fillBuildings() {
        const rooms = $('fKind').value === 'Venue';
        const opts = rooms
            ? ['Any AIKOL building'].concat([...new Set(A.venues.map(v => v.building))])
            : ['Any vehicle'];
        $('fBuilding').innerHTML = opts.map(o => '<option>' + A.esc(o) + '</option>').join('');
        $('fBuilding').disabled = !rooms;
    }
    fillBuildings();
    $('fKind').addEventListener('change', () => { fillBuildings(); $('searchResult').innerHTML = ''; });

    function freeResources() {
        const kind = $('fKind').value;
        const date = $('fDate').value, from = $('fFrom').value, to = $('fTo').value;
        const s = date + 'T' + from, e = date + 'T' + to;
        const building = $('fBuilding').value;
        const pool = (kind === 'Venue' ? A.venues : A.vehicles).filter(r =>
            r.status === 'Active' &&
            (kind !== 'Venue' || building.indexOf('Any') === 0 || r.building === building));
        return {
            s: s, e: e, kind: kind, date: date, from: from, to: to,
            free: pool.filter(r => !A.findConflicts(r.id, s, e).length),
            busy: pool.filter(r => A.findConflicts(r.id, s, e).length)
        };
    }

    function render(r) {
        const box = $('searchResult');
        const label = A.fmtDate(r.date) + ', ' + A.fmtRange(r.from, r.to);
        const noun = r.kind === 'Venue' ? 'room' : 'vehicle';

        /* Kulliyyah cars are for lecturers and staff. Say so here rather than
           letting someone pick a car and be refused two screens later. */
        if (r.kind === 'Vehicle' && !A.canBookVehicle(me)) {
            box.innerHTML = '<div class="notice notice-warn"><strong>Vehicles are booked by lecturers and staff.</strong>' +
                A.esc(A.STUDENT_TRANSPORT.note) + '</div>';
            return;
        }
        if (A.toMin(r.to) <= A.toMin(r.from)) {
            box.innerHTML = '<div class="notice notice-danger">The end time must be after the start time.</div>';
            return;
        }
        if (A.minutesBetween(r.s, r.e) > S.maxBookingMinutes && r.kind === 'Venue') {
            box.innerHTML = '<div class="notice notice-danger"><strong>That is longer than ' +
                (S.maxBookingMinutes / 60) + ' hours.</strong>A single booking may last at most ' +
                (S.maxBookingMinutes / 60) + ' hours — book a second period to continue.</div>';
            return;
        }

        if (!r.free.length) {
            box.innerHTML = '<div class="notice notice-warn">' +
                '<strong>Nothing free ' + A.esc(label) + '.</strong>' +
                'All ' + r.busy.length + ' ' + noun + 's are taken for that period. The availability board ' +
                'shows the whole day at once, so you can find the nearest gap.</div>' +
                '<a class="btn btn-primary" href="availability.html">Open the availability board</a>';
            return;
        }

        box.innerHTML = '<div class="notice notice-success"><strong>' + r.free.length + ' ' + noun +
            (r.free.length === 1 ? ' is' : 's are') + ' free ' + A.esc(label) + '.</strong>' +
            'Choose one to book. Every booking is confirmed by the Kulliyyah office.</div>' +
            '<div class="grid grid-4">' + r.free.slice(0, 8).map(x =>
                '<div class="venue-card"><div class="body">' +
                '<h3>' + A.esc(x.name) + '</h3>' +
                '<span class="loc">' + A.esc(r.kind === 'Venue'
                    ? x.location + ' · ' + x.capacity + ' persons'
                    : x.registration + ' · ' + x.seats + ' seats') + '</span>' +
                '<div style="margin-top:8px"><span class="badge badge-approved">Free</span></div>' +
                '</div><div class="actions">' +
                '<button class="btn btn-sm btn-primary" type="button" data-book="' + x.id + '">Book this ' +
                noun + '</button></div></div>').join('') +
            '</div>' +
            (r.busy.length ? '<p class="help">' + r.busy.length + ' other ' + noun +
                (r.busy.length === 1 ? ' is' : 's are') + ' taken for that period.</p>' : '');

        box.querySelectorAll('button[data-book]').forEach(btn =>
            btn.addEventListener('click', () => confirmBooking(A.resourceById(Number(btn.dataset.book)), r)));
    }

    function confirmBooking(res, r) {
        const m = A.modal({
            title: 'Confirm your booking',
            body: '<dl class="kv">' +
                '<dt>' + (r.kind === 'Venue' ? 'Room' : 'Vehicle') + '</dt><dd>' + A.esc(res.name) + '</dd>' +
                '<dt>When</dt><dd>' + A.esc(A.fmtDate(r.date) + ', ' + A.fmtRange(r.from, r.to)) + '</dd>' +
                '<dt>Booked for</dt><dd>' + A.esc(me.name) + '</dd>' +
                '</dl>' +
                '<div class="field" style="margin-top:14px">' +
                '<label for="bPurpose">Purpose <span class="req" aria-hidden="true">*</span></label>' +
                '<textarea class="textarea" id="bPurpose" placeholder="For example: postgraduate research seminar"></textarea>' +
                '<p class="help">Visible to the approving officer.</p></div>' +
                '<div id="bErr" aria-live="polite"></div>' +
                '<div class="notice notice-info">The request is submitted as <strong>pending</strong>. ' +
                'Every booking is decided by the Kulliyyah office, and you may cancel your own up to ' +
                (S.cancellationCutoffHours / 24) + ' days before.</div>',
            buttons: [
                { label: 'Back' },
                { label: 'Confirm booking', cls: 'btn-primary', onClick: root => {
                    const purpose = root.querySelector('#bPurpose').value.trim();
                    if (!purpose) {
                        root.querySelector('#bErr').innerHTML =
                            '<div class="notice notice-danger">A purpose is required.</div>';
                        return false;
                    }
                    /* Re-checked at the moment of booking, not only at search:
                       someone may have taken the slot in between. */
                    if (A.findConflicts(res.id, r.s, r.e).length) {
                        A.toast('That slot was taken while you were filling this in. Search again to see ' +
                                'what is still free.', 'danger');
                        return;
                    }
                    const ref = 'AIKOL-B-' + todayISO.slice(0, 4) + '-' +
                                String(1000 + Math.floor(Math.random() * 8999)).slice(0, 4);
                    A.modal({
                        title: 'Request submitted',
                        body: '<div class="notice notice-success"><strong>Reference ' + A.esc(ref) + '</strong>' +
                              A.esc(res.name) + ' · ' + A.esc(A.fmtDate(r.date) + ', ' + A.fmtRange(r.from, r.to)) +
                              ' — pending approval.</div>' +
                              A.emailNotice(me.email, 'booking submitted'),
                        buttons: [{ label: 'View my bookings', cls: 'btn-primary',
                                    onClick: () => { window.location.href = 'my-bookings.html'; } },
                                  { label: 'Close' }]
                    });
                } }
            ]
        });
    }

    $('searchbar').addEventListener('submit', e => { e.preventDefault(); render(freeResources()); });
    ['fDate', 'fFrom', 'fTo', 'fBuilding'].forEach(id =>
        $(id).addEventListener('change', () => { $('searchResult').innerHTML = ''; }));

    /* Prefer the Kulliyyah's own photograph; fall back to the generated
       placeholder so the hero is never a blank green panel. */
    const heroImg = document.getElementById('heroImg');
    heroImg.addEventListener('error', function onFail() {
        this.removeEventListener('error', onFail);
        this.src = 'assets/images/aikol-building.svg';
    });

    /* ---- Your activity ---- */
    const mine = A.bookings.filter(b => b.userId === me.id);
    const next = mine.filter(b => b.status === 'Approved' && A.toDate(b.startAt) > now)
        .sort((a, b) => a.startAt < b.startAt ? -1 : 1)[0];
    const pending = mine.filter(b => b.status === 'Pending');

    function cell(label, value, dim, last) {
        return '<div style="padding: 13px 18px;' +
            (last ? '' : ' border-right: 1px solid rgba(255,255,255,.14);') + '">' +
            '<div style="font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold);">' +
            A.esc(label) + '</div>' +
            '<div style="margin-top: 3px; font-size: 13.5px; color: ' +
            (dim ? 'rgba(255,255,255,.72)' : '#fff') + ';">' + value + '</div></div>';
    }

    document.getElementById('strip').innerHTML =
        cell('Your next booking',
             next ? A.esc(next.resource.name) + ' · ' + A.esc(A.fmtDate(next.date)) + ', ' + A.fmtTime(next.start)
                  : 'Nothing booked yet', !next) +
        cell('Awaiting approval',
             pending.length
                ? pending.length + ' request' + (pending.length === 1 ? '' : 's') + ' · ' +
                  A.esc(pending[0].resource.name)
                : 'None', !pending.length, true);

    /* ---- Browse by room type ---- */
    const byType = {};
    A.venues.forEach(v => { (byType[v.venueType] = byType[v.venueType] || []).push(v); });

    document.getElementById('cats').innerHTML = Object.keys(byType).slice(0, 4).map(type => {
        const list = byType[type];
        const caps = list.map(v => v.capacity).sort((a, b) => a - b);
        const free = list.filter(v => v.status === 'Active').length;
        const count = list.length + ' room' + (list.length === 1 ? '' : 's') + ' · ' +
            (caps[0] === caps[caps.length - 1] ? 'up to ' + caps[0] : caps[0] + '–' + caps[caps.length - 1]) + ' persons';
        const freeText = free === list.length
            ? (list.length === 1 ? 'Available today' : 'All free at some point today')
            : free + ' of ' + list.length + ' available';
        return '<a class="venue-card" href="venues.html" style="text-decoration: none;">' +
            '<div class="thumb"><img src="' + A.resourceImg(list[0]) +
            '" alt="Placeholder image of ' + A.esc(type) + '"></div>' +
            '<div class="body">' +
            '<h3>' + A.esc(type + (list.length > 1 ? 's' : '')) + '</h3>' +
            '<span class="loc">' + A.esc(count) + '</span>' +
            '<div style="margin-top: 6px;"><span class="badge badge-approved">' + A.esc(freeText) + '</span></div>' +
            '</div></a>';
    }).join('');
})();
</script>
</body>
</html>
