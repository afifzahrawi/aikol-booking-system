<nav class="workspace-tabs workspace-tabs-prominent" aria-label="Booking resource type">
    {% if user.is_administrator %}
        <a href="{% url 'bookings:calendar' %}"
           {% if booking_tab == 'calendar' %}aria-current="page"{% endif %}>Calendar</a>
        <a href="{% url 'bookings:manage' %}?kind={{ venue_kind }}"
           {% if booking_tab == 'venues' %}aria-current="page"{% endif %}>Venues</a>
        <a href="{% url 'bookings:manage' %}?kind={{ vehicle_kind }}"
           {% if booking_tab == 'vehicles' %}aria-current="page"{% endif %}>Vehicles{% if management_waiting %} <span class="tab-count" aria-label="{{ management_waiting }} waiting for management">{{ management_waiting }}</span>{% endif %}</a>
    {% endif %}
    <a href="{% url 'bookings:approvals' %}"
       {% if booking_tab == 'awaiting' %}aria-current="page"{% endif %}>Awaiting Decision{% if pending_count %} <span class="tab-count">{{ pending_count }}</span>{% endif %}</a>
</nav>
