<div class="btn-group">
    <form method="post" action="{% url 'bookings:key_confirm' h.pk step %}" class="inline">
        {% csrf_token %}<input type="hidden" name="decision" value="confirm">
        <button class="btn btn-sm btn-primary" type="submit">Confirm</button>
    </form>
    <form method="post" action="{% url 'bookings:key_confirm' h.pk step %}" class="inline">
        {% csrf_token %}<input type="hidden" name="decision" value="reject">
        <button class="btn btn-sm btn-danger" type="submit">Reject</button>
    </form>
</div>
